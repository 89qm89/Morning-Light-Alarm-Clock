name: Build Windows App

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: MorningGlowAlarm-Windows11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MorningGlowAlarm-Windows11/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build installer and portable app
        run: npm run dist:win -- --publish never

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Glow-Alarm-Windows-v1.1.0
          path: MorningGlowAlarm-Windows11/release/*.exe
          if-no-files-found: error
          retention-days: 30
