name: Build and Release Windows App

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "MorningGlowAlarm-Windows11/package.json"

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: MorningGlowAlarm-Windows11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MorningGlowAlarm-Windows11/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build installer and portable app
        run: npm run dist:win -- --publish never

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Morning-Glow-Alarm-Windows
          path: MorningGlowAlarm-Windows11/release/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Version Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify version number changed
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          package_path='MorningGlowAlarm-Windows11/package.json'
          current=$(node -p "require('./MorningGlowAlarm-Windows11/package.json').version")
          git show "${BEFORE_SHA}:${package_path}" > /tmp/previous-package.json
          previous=$(node -p "require('/tmp/previous-package.json').version")
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$previous" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged; release upload will be skipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $previous to $current."
          fi

      - name: Download verified Windows builds
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Morning-Glow-Alarm-Windows
          path: release-assets

      - name: Create or update release
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -name '*.exe' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows EXE files found"
            exit 1
          fi

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "${files[@]}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "晨光闹钟 $tag" \
              --notes "自动构建的 Windows 正式版本，包含安装版和便携版。"
          fi
