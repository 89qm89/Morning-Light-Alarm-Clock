name: 发布晨光闹钟 v1.1.0

on:
  workflow_dispatch:

jobs:
  release:
    name: 构建并发布 v1.1.0
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: MorningGlowAlarm-Windows11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MorningGlowAlarm-Windows11/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build installer and portable app
        run: npm run dist:win -- --publish never

      - name: Publish v1.1.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.1.0') { throw "This workflow may only publish v1.1.0" }

          $tag = 'v1.1.0'
          $files = Get-ChildItem -Path release -Filter *.exe | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No Windows EXE files found" }

          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $files `
              --repo "${{ github.repository }}" `
              --target main `
              --title "晨光闹钟 v1.1.0" `
              --notes "新增曜石黑白主题、自然语言快速创建、删除撤销、更新跳转与九十秒铃声渐强。包含 Windows 安装版和便携版。"
          }
